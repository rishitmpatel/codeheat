<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>codeheat · flask</title>
<style>
:root {
  --bg: #f5f1e8;
  --bg-2: #efe9dc;
  --card: #fffdf9;
  --card-2: #faf6ee;
  --ink: #1f1a16;
  --ink-2: #5a5148;
  --ink-3: #8a8077;
  --line: #e3dbcb;
  --line-2: #d3c9b5;
  --accent: #d4482a;
  --focus: #1f6feb;
  --h0: #ece6d8;
  --h1: #f6cf8e;
  --h2: #f08a4b;
  --h3: #d4373a;
  --h4: #7a1030;
  --cold: #e4ddcc;
  --sev-high: #c4271f;
  --sev-med: #b86a00;
  --sev-low: #2b6fb5;
  --sev-info: #7a7168;
  --good: #2e8a57;
  --shadow: 0 1px 0 rgba(60, 40, 10, .04), 0 10px 30px -14px rgba(80, 50, 10, .22);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Source Serif Pro", Georgia, "DejaVu Serif", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Liberation Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e13; --bg-2: #17141b; --card: #17141b; --card-2: #1d1923;
    --ink: #f3eee8; --ink-2: #b6aca4; --ink-3: #7f7770; --line: #2a2530; --line-2: #3a3341;
    --accent: #ff7a45; --focus: #6aa4ff;
    --h0: #241f2e; --h1: #5b1f66; --h2: #c11f4d; --h3: #f2641e; --h4: #ffd23f;
    --cold: #201c29;
    --sev-high: #ff6b5f; --sev-med: #ffb454; --sev-low: #6aa4ff; --sev-info: #9a9188; --good: #5fcf8f;
    --shadow: 0 0 0 1px rgba(255,255,255,.02), 0 18px 40px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --bg: #100e13; --bg-2: #17141b; --card: #17141b; --card-2: #1d1923;
  --ink: #f3eee8; --ink-2: #b6aca4; --ink-3: #7f7770; --line: #2a2530; --line-2: #3a3341;
  --accent: #ff7a45; --focus: #6aa4ff;
  --h0: #241f2e; --h1: #5b1f66; --h2: #c11f4d; --h3: #f2641e; --h4: #ffd23f;
  --cold: #201c29;
  --sev-high: #ff6b5f; --sev-med: #ffb454; --sev-low: #6aa4ff; --sev-info: #9a9188; --good: #5fcf8f;
  --shadow: 0 0 0 1px rgba(255,255,255,.02), 0 18px 40px -22px rgba(0,0,0,.8);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--h2) 14%, transparent), transparent 70%);
  background-repeat: no-repeat;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
code, .mono { font-family: var(--mono); font-size: .92em; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ---- top bar ---- */
.top { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(12px) saturate(1.3);
  background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
.top::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--h0), var(--h1), var(--h2), var(--h3), var(--h4)); }
.top-in { display: flex; align-items: center; gap: 24px; height: 52px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-weight: 700; font-size: 1.18rem; letter-spacing: -.01em; text-decoration: none; }
.flame { width: 14px; height: 14px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg);
  background: linear-gradient(135deg, var(--h4), var(--h3) 45%, var(--h2)); box-shadow: 0 0 12px color-mix(in srgb, var(--h3) 60%, transparent); }
#nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
#nav a { padding: 6px 11px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-size: .86rem; white-space: nowrap; }
#nav a:hover { background: var(--bg-2); color: var(--ink); }
.top-in .icon-btn { margin-left: auto; }
#nav + .icon-btn { margin-left: 0; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn:hover { border-color: var(--line-2); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---- hero ---- */
.hero { padding: 26px 0 4px; }
.eyebrow { font: 600 .72rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.hero h1 { font: 700 clamp(2.2rem, 5vw, 3.2rem)/1 var(--serif); letter-spacing: -.03em; margin: 0 0 10px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--h3), var(--h2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .92rem; }
.sub > span::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); margin-right: 9px; vertical-align: middle; }
.sub > span:first-child::before { display: none; }
.hero-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.5fr); gap: 36px; align-items: end; }
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.sub { flex-direction: row; gap: 2px 14px; }
.sub > span::before { display: none !important; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 9px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi .v { font: 700 1.5rem/1.05 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .k { font-size: .66rem; color: var(--ink-2); margin-top: 5px; text-transform: uppercase; letter-spacing: .07em; }
.kpi .n { font-size: .74rem; color: var(--ink-3); margin-top: 2px; }
.kpi.hot .v { color: var(--accent); }
.kpi.hot::after { content: ""; position: absolute; right: -24px; top: -24px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--h3) 30%, transparent), transparent 70%); }

/* ---- sections ---- */
.sec { padding: 34px 0 6px; }
.sec:first-of-type { padding-top: 20px; }
.sec h2 { font: 700 1.55rem/1.15 var(--serif); letter-spacing: -.02em; margin: 0 0 6px; }
.lede { color: var(--ink-2); max-width: 78ch; margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.empty { color: var(--ink-3); padding: 22px; text-align: center; }

/* ---- findings ---- */
.findings { display: grid; gap: 0; overflow: hidden; }
.finding { display: grid; grid-template-columns: 38px 64px 1fr; gap: 14px; align-items: start; padding: 15px 20px; border-top: 1px solid var(--line); }
.finding:first-child { border-top: 0; }
.finding.clickable { cursor: pointer; }
.finding.clickable:hover { background: var(--card-2); }
.finding .no { font: 700 1.3rem/1.2 var(--serif); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 700 .66rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; margin-top: 3px; text-align: center; }
.pill.high { color: var(--sev-high); background: color-mix(in srgb, var(--sev-high) 13%, transparent); }
.pill.medium { color: var(--sev-med); background: color-mix(in srgb, var(--sev-med) 15%, transparent); }
.pill.low { color: var(--sev-low); background: color-mix(in srgb, var(--sev-low) 13%, transparent); }
.pill.info { color: var(--sev-info); background: color-mix(in srgb, var(--sev-info) 14%, transparent); }
.finding .t { font-size: 1rem; line-height: 1.45; }
.finding .t code { background: var(--bg-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; white-space: nowrap; font-size: .86em; }
.finding .d { color: var(--ink-2); font-size: .88rem; margin-top: 3px; }
.finding .cat { color: var(--ink-3); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }

/* ---- map ---- */
.maprow { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: .82rem; color: var(--ink-2); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--line); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: .84rem; margin-left: auto; color: var(--ink-3); }
.crumbs button { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 6px; color: var(--ink-2); font-family: var(--mono); font-size: .8rem; }
.crumbs button:hover { background: var(--bg-2); color: var(--ink); }
.crumbs button:last-child { color: var(--ink); font-weight: 600; }
#mapwrap { position: relative; padding: 10px; }
#treemap { display: block; width: 100%; height: clamp(440px, 62vh, 660px); border-radius: 10px; background: var(--bg-2); }
#treemap text { font-family: var(--sans); pointer-events: none; }
#treemap .dir-bg { fill: var(--card-2); stroke: var(--line-2); stroke-width: 1; }
#treemap .dir-head { fill: var(--ink-2); font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }
#treemap .dir-hit { fill: transparent; cursor: zoom-in; }
#treemap .file { stroke: var(--bg-2); stroke-width: 1; cursor: pointer; transition: opacity .12s; }
#treemap .file:hover { stroke: var(--ink); stroke-width: 1.5; }
#treemap .file.sel { stroke: var(--focus); stroke-width: 2.5; }
#treemap .file.dim { opacity: .28; }
#treemap .lbl { font-size: 11px; font-weight: 600; }
#treemap .lbl2 { font-size: 9.5px; opacity: .8; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 0 14px 12px; font-size: .78rem; color: var(--ink-2); }
.legend .ramp { width: 170px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--h0), var(--h1), var(--h2), var(--h3), var(--h4)); border: 1px solid var(--line); }
.legend .sw { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.hint { margin-left: auto; color: var(--ink-3); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 9px 12px; border-radius: 10px; font-size: .8rem; line-height: 1.4; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,.35); opacity: 0; transition: opacity .1s; }
#tip.on { opacity: 1; }
#tip b { display: block; font-family: var(--mono); font-size: .8rem; word-break: break-all; margin-bottom: 3px; }
#tip .r { display: flex; justify-content: space-between; gap: 18px; }
#tip .r span:first-child { opacity: .65; }

/* detail panel */
.detail { padding: 18px; position: sticky; top: 68px; }
.detail h3 { font: 700 1.05rem/1.25 var(--serif); margin: 0 0 2px; word-break: break-all; }
.detail .dir { color: var(--ink-3); font-family: var(--mono); font-size: .76rem; word-break: break-all; }
.detail .ring { display: flex; align-items: center; gap: 14px; margin: 14px 0; }
.detail .big { font: 700 2.3rem/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.detail .big small { display: block; font: 600 .68rem/1.2 var(--sans); color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: .84rem; }
.grid2 div span { display: block; color: var(--ink-3); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
.grid2 div b { font-variant-numeric: tabular-nums; font-size: 1rem; }
.detail h4 { margin: 16px 0 6px; font: 700 .7rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.fnrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: .8rem; padding: 3px 0; }
.fnrow code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnrow .b { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--bg-2); overflow: hidden; }
.fnrow .b i { display: block; height: 100%; background: var(--h3); border-radius: 2px; }
.own { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: var(--bg-2); }
.own i { display: block; height: 100%; }
.owner-line { display: flex; align-items: center; gap: 8px; font-size: .84rem; margin-bottom: 7px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.muted { color: var(--ink-3); }
.warn { color: var(--sev-high); font-weight: 600; }
.placeholder { color: var(--ink-3); font-size: .9rem; padding: 26px 6px; text-align: center; }
.coupled { font-size: .8rem; padding: 3px 0; display: flex; justify-content: space-between; gap: 8px; }
.coupled code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: right; width: 44px; color: var(--ink-3); }
th.l, td.l { text-align: left; }
th { font: 700 .68rem/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; user-select: none; background: var(--card-2); position: sticky; top: 0; }
th:hover { color: var(--ink); }
th .arrow { display: inline-block; width: 10px; color: var(--accent); }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--card-2); }
tr.expandable { cursor: pointer; }
td.file { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
td.file .fdir { color: var(--ink-3); }
td.file .fname { font-weight: 600; }
td.file .tag { font: 700 .6rem/1 var(--sans); letter-spacing: .06em; padding: 2px 5px; border-radius: 4px; margin-left: 6px; color: var(--ink-3); border: 1px solid var(--line-2); vertical-align: 1px; }
.scorecell { display: flex; align-items: center; gap: 9px; justify-content: flex-end; }
.scorebar { width: 76px; height: 8px; border-radius: 4px; background: var(--bg-2); overflow: hidden; flex: none; }
.scorebar i { display: block; height: 100%; border-radius: 4px; }
.num-hot { color: var(--sev-high); font-weight: 700; }
.num-warm { color: var(--sev-med); font-weight: 700; }
tr.sub td { background: var(--card-2); padding: 12px 18px 14px 56px; text-align: left; white-space: normal; }
tr.sub .fl { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 28px; }
.tfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; color: var(--ink-3); font-size: .8rem; }
.link-btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: .82rem; }
.link-btn:hover { border-color: var(--ink-3); }
.filter { border: 1px solid var(--line); background: var(--bg-2); border-radius: 9px; padding: 6px 11px; font: inherit; font-size: .84rem; width: 220px; color: var(--ink); }
.spark { vertical-align: middle; }

/* ---- trends ---- */
.cards3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 14px; }
.tcard { padding: 16px 18px 12px; }
.tcard .hd { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tcard .nm { font-family: var(--mono); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcard .ch { font: 700 .95rem/1 var(--serif); font-variant-numeric: tabular-nums; flex: none; }
.tcard svg { width: 100%; height: 118px; display: block; margin-top: 6px; overflow: visible; }
.up { color: var(--sev-high); } .down { color: var(--good); } .flat { color: var(--ink-3); }
.axis text { fill: var(--ink-3); font-size: 10px; font-family: var(--sans); }
.grid-line { stroke: var(--line); stroke-width: 1; }

/* ---- coupling ---- */
.two { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pair { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 120px; gap: 4px 16px; align-items: center; }
.pair:first-child { border-top: 0; }
.pair code { font-size: .8rem; word-break: break-all; }
.pair .arrow { color: var(--ink-3); margin: 0 4px; }
.pair .meta { font-size: .76rem; color: var(--ink-3); grid-column: 1; }
.pair .deg { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.pair .deg b { font: 700 1.25rem/1 var(--serif); font-variant-numeric: tabular-nums; }
.pair .deg div { height: 5px; background: var(--bg-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.pair .deg i { display: block; height: 100%; background: linear-gradient(90deg, var(--h2), var(--h3)); }
.badge { display: inline-block; font: 700 .62rem/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }
.badge.x { color: var(--sev-med); background: color-mix(in srgb, var(--sev-med) 16%, transparent); }
.badge.k { color: var(--ink-3); background: var(--bg-2); }
#matrix { width: 100%; display: block; }
#matrix text { font-family: var(--mono); font-size: 10px; fill: var(--ink-2); }
#matrix rect.cell { stroke: var(--card); stroke-width: 1.5; }
#matrix rect.cell:hover { stroke: var(--ink); }

/* ---- knowledge ---- */
.own-bar { width: 140px; display: inline-block; vertical-align: middle; }
.status-gone { color: var(--sev-high); font-weight: 600; }
.status-ok { color: var(--good); }
.bf { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 6px; font-weight: 700; font-size: .8rem; }
.bf.b1 { color: var(--sev-high); background: color-mix(in srgb, var(--sev-high) 14%, transparent); }
.bf.b2 { color: var(--sev-med); background: color-mix(in srgb, var(--sev-med) 15%, transparent); }
.bf.b3 { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.activity { padding: 16px 18px 8px; }
.activity svg { width: 100%; height: 130px; display: block; overflow: visible; }

/* ---- method ---- */
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.method .card { padding: 16px 18px; font-size: .88rem; color: var(--ink-2); }
.method h4 { font: 700 1rem/1.2 var(--serif); color: var(--ink); margin: 0 0 6px; }
.method p { margin: 0 0 8px; }
.method code { background: var(--bg-2); padding: 1px 5px; border-radius: 4px; }
footer { padding: 40px 0 60px; color: var(--ink-3); font-size: .82rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

@media (max-width: 1080px) {
  .hero-grid { grid-template-columns: 1fr; gap: 20px; }
  .maprow, .two { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .finding { grid-template-columns: 28px 1fr; }
  .finding .pill { grid-column: 2; justify-self: start; }
  .finding .body { grid-column: 2; }
  #treemap { height: 420px; }
  .brand { font-size: 1.05rem; }
  #nav { display: none; }
  .hero { padding-top: 34px; }
}
@media print { .top { position: static; } .detail { position: static; } }

@keyframes enter { from { opacity: 0; } to { opacity: 1; } }
#treemap .enter { animation: enter .22s ease-out; }
@media (prefers-reduced-motion: reduce) { #treemap .enter { animation: none; } html { scroll-behavior: auto; } }

.owner-line { flex-wrap: wrap; row-gap: 2px; }
.detail .grid2 b { white-space: nowrap; }

.two > .card.pad { position: sticky; top: 68px; }
@media (max-width: 1080px) { .two > .card.pad { position: static; } }

.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--ink-2); cursor: pointer; }
.chk input { accent-color: var(--accent); }

</style>
</head>
<body>

/* ---------- tree ---------- */
function buildTree() {
  const rootN = { name: "", path: "", kids: new Map(), parent: null, dir: true };
  for (let i = 0; i < FILES.length; i++) {
    const f = FILES[i]; if (!st.tests && isTest(f.p)) continue; const parts = f.p.split("/"); let n = rootN;
    for (let k = 0; k < parts.length - 1; k++) {
      let c = n.kids.get(parts[k]);
      if (!c) { c = { name: parts[k], path: parts.slice(0, k + 1).join("/"), kids: new Map(), parent: n, dir: true }; n.kids.set(parts[k], c); }
      n = c;
    }
    n.kids.set(parts[parts.length - 1], { name: parts[parts.length - 1], path: f.p, fi: i, parent: n, value: Math.max(f.l, 1), dir: false });
  }
  const fin = n => {
    if (!n.dir) return n;
    n.kids = Array.from(n.kids.values()).map(fin);
    while (n.parent && n.kids.length === 1 && n.kids[0].dir) { // collapse a/b/c chains
      const c = n.kids[0]; n.name += "/" + c.name; n.path = c.path; n.kids = c.kids; n.kids.forEach(k => (k.parent = n));
    }
    n.kids.sort((a, b) => b.value - a.value);
    return n;
  };
  const val = n => { if (!n.dir) return n.value; n.value = n.kids.reduce((s, k) => s + val(k), 0); return n.value; };
  fin(rootN); val(rootN); rootN.kids.sort((a, b) => b.value - a.value);
  const sortRec = n => { if (n.dir) { n.kids.sort((a, b) => b.value - a.value); n.kids.forEach(sortRec); } };
  sortRec(rootN);
  const rep = n => {
    if (!n.dir) { n.rep = n; n.big = n; n.nf = 1; return n; }
    let best = null, big = null; n.nf = 0;
    for (const k of n.kids) { rep(k); n.nf += k.nf; const a = k.rep; if (!best || FILES[a.fi].s > FILES[best.fi].s) best = a; if (!big || k.big.value > big.value) big = k.big; }
    n.rep = best; n.big = big; return n;
  };
  rep(rootN);
  const idx = new Map(); const walk = n => { if (n.dir) { idx.set(n.path, n); n.kids.forEach(walk); } }; walk(rootN);
  return { rootN, idx };
}
let TREE = buildTree();

function squarify(items, x, y, w, h) {
  const out = []; const total = items.reduce((a, b) => a + b.value, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const k = (w * h) / total; let i = 0;
  while (i < items.length) {
    const short = Math.min(w, h); let sum = 0, mn = Infinity, mx = 0, j = i, worst = Infinity;
    for (; j < items.length; j++) {
      const a = items[j].value * k, s2 = sum + a, mn2 = Math.min(mn, a), mx2 = Math.max(mx, a);
      const wr = Math.max((short * short * mx2) / (s2 * s2), (s2 * s2) / (short * short * mn2));
      if (wr > worst && j > i) break;
      worst = wr; sum = s2; mn = mn2; mx = mx2;
    }
    const row = items.slice(i, j);
    if (w >= h) { const cw = sum / h; let cy = y; for (const it of row) { const ch = (it.value * k) / cw; out.push({ n: it, x, y: cy, w: cw, h: ch }); cy += ch; } x += cw; w -= cw; }
    else { const rh = sum / w; let cx = x; for (const it of row) { const cw2 = (it.value * k) / rh; out.push({ n: it, x: cx, y, w: cw2, h: rh }); cx += cw2; } y += rh; h -= rh; }
    i = j;
  }
  return out;
}

/* ---------- map render ---------- */
let mapEl;
let drawn = [];
function drawMap() {
  const W = mapEl.clientWidth || 900, H = mapEl.clientHeight || 600;
  mapEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const node = TREE.idx.get(st.zoom) || TREE.rootN;
  const parts = [];
  drawn = [];
  const textFill = c => (lum(c) > 0.58 ? "#1b1613" : "#fffaf3");
  const place = (n, x, y, w, h, depth) => {
    if (!n.dir) {
      const f = FILES[n.fi], c = fileColor(f), r = { t: "f", fi: n.fi, x, y, w, h };
      drawn.push(r);
      let s = `<rect class="file${st.sel === n.fi ? " sel" : ""}" data-f="${n.fi}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(0, w).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="${w > 12 && h > 12 ? 3 : 1}" fill="${rgb(c)}"/>`;
      if (w >= 46 && h >= 17) {
        const maxc = Math.floor((w - 10) / 6.3);
        let name = n.name; if (name.length > maxc) name = name.slice(0, Math.max(1, maxc - 1)) + "…";
        s += `<text class="lbl" x="${(x + 6).toFixed(1)}" y="${(y + 14).toFixed(1)}" fill="${textFill(c)}">${esc(name)}</text>`;
        const sub = fileSub(f);
        if (h >= 32 && sub && w >= 40) s += `<text class="lbl2" x="${(x + 6).toFixed(1)}" y="${(y + 27).toFixed(1)}" fill="${textFill(c)}">${esc(sub)}</text>`;
      }
      parts.push(s); return;
    }
    // directory
    const showHead = w > 64 && h > 40 && depth >= 0;
    const head = showHead ? 17 : 0;
    parts.push(`<rect class="dir-bg" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/>`);
    drawn.push({ t: "d", path: n.path, x, y, w, h });
    parts.push(`<rect class="dir-hit" data-d="${esc(n.path)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/>`);
    if (w < 16 || h < 16) { // too small to subdivide: paint the representative file
      const c = fileColor(FILES[(st.mode === "owner" || st.mode === "bus" || st.mode === "gone" ? n.big : n.rep).fi]);
      parts.push(`<rect data-d="${esc(n.path)}" class="dir-hit" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${rgb(c)}" style="fill:${rgb(c)}"/>`);
      return;
    }
    if (showHead) {
      const maxc = Math.floor((w - 12) / 6.4); let name = n.name;
      if (name.length > maxc) name = "…" + name.slice(-(maxc - 1));
      parts.push(`<text class="dir-head" x="${(x + 6).toFixed(1)}" y="${(y + 12.5).toFixed(1)}">${esc(name)}</text>`);
    }
    const pad = w > 30 && h > 30 ? 2.5 : 1;
    const kids = squarify(n.kids, x + pad, y + head + pad - (head ? 1 : 0), w - 2 * pad, h - head - 2 * pad + (head ? 1 : 0));
    for (const k of kids) place(k.n, k.x, k.y, k.w, k.h, depth + 1);
  };
  const kids = squarify(node.kids, 4, 4, W - 8, H - 8);
  for (const k of kids) place(k.n, k.x, k.y, k.w, k.h, 0);
  mapEl.innerHTML = `<g class="enter">${parts.join("")}</g>`;
  renderCrumbs(node);
}
function renderCrumbs(node) {
  const chain = []; for (let n = node; n; n = n.parent) chain.unshift(n);
  $("#crumbs").innerHTML = chain.map((n, i) => `<button data-z="${esc(n.path)}">${esc(i === 0 ? M.repo : n.name)}</button>`).join('<span>/</span>');
}

  { k: "tr", t: "Trend", f: f => trendSpark(f.p), v: f => { const t = D.trends.find(x => x.p === f.p); return t ? (t.ch || 0) : -9; } },

function trendSpark(p) {
  const t = D.trends.find(x => x.p === p); if (!t) return '<span class="muted">–</span>';
  const v = t.pts.map(q => q[1]); const nums = v.filter(x => x != null); if (nums.length < 2) return "";
  const lo = Math.min(...nums), hi = Math.max(...nums), top = Math.max(hi, lo + 0.25 * hi), W = 70, H = 20;

}
function tableRows() {
  let rows = hot.slice();

/* trends */
function trendCard(t) {
  const W = 340, H = 118, L = 34, R = 8, T = 8, B = 20;
  const v = t.pts.map(p => p[1]); const nums = v.filter(x => x != null);
  if (!nums.length) return "";
  const mx = Math.max(...nums), mn = Math.min(...nums);
  const lo = (mx - mn) / (mx || 1) > 0.3 ? 0 : Math.max(0, mn - 0.35 * mx), hi = mx + (mx - lo) * 0.08 || 1;
  const X = i => L + (i / (v.length - 1)) * (W - L - R), Y = x => T + (1 - (x - lo) / (hi - lo)) * (H - T - B);
  const segs = []; let cur = [];
  v.forEach((x, i) => { if (x == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([X(i), Y(x)]); }); if (cur.length) segs.push(cur);
  const col = (t.ch || 0) > 0.05 ? css("--sev-high") : (t.ch || 0) < -0.05 ? css("--good") : css("--accent");
  const line = s => s.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const ticks = [lo, (lo + hi) / 2, hi].map(x => Math.round(x));
  const last = segs[segs.length - 1], lp = last[last.length - 1];
  const gid = "g" + Math.abs(t.p.split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7));
  const dateL = [t.pts[0][0], t.pts[t.pts.length - 1][0]];
  return `<div class="card tcard"><div class="hd"><span class="nm" title="${esc(t.p)}">${esc(t.p)}</span><span class="ch ${(t.ch || 0) > 0.05 ? "up" : (t.ch || 0) < -0.05 ? "down" : "flat"}">${t.ch == null ? "-" : (t.ch > 0 ? "+" : "") + (t.ch * 100).toFixed(0) + "%"}</span></div>
  <svg viewBox="0 0 ${W} ${H}" data-t="${esc(t.p)}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <g class="axis">${ticks.map(x => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${Y(x).toFixed(1)}" y2="${Y(x).toFixed(1)}"/><text x="${L - 6}" y="${(Y(x) + 3).toFixed(1)}" text-anchor="end">${x}</text>`).join("")}
  <text x="${L}" y="${H - 4}">${dateL[0]}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${dateL[1]}</text></g>
  ${segs.map(s => `<path d="${line(s)} L${s[s.length - 1][0].toFixed(1)} ${Y(lo)} L${s[0][0].toFixed(1)} ${Y(lo)}Z" fill="url(#${gid})"/><path d="${line(s)}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
  ${v.map((x, i) => x == null ? "" : `<circle cx="${X(i).toFixed(1)}" cy="${Y(x).toFixed(1)}" r="${i === v.length - 1 ? 3.6 : 2}" fill="${i === v.length - 1 ? col : css("--card")}" stroke="${col}" stroke-width="1.5"><title>${t.pts[i][0]}: CCN ${x}, ${fmt(t.pts[i][2])} LOC</title></circle>`).join("")}
  <text x="${Math.min(lp[0], W - R - 2).toFixed(1)}" y="${(lp[1] - 9).toFixed(1)}" text-anchor="end" style="font:700 11px var(--sans);fill:${col}">${v[v.length - 1]}</text></svg></div>`;
}
function activityHtml() {
  const A = D.activity; if (!A.length) return "";
  const W = 1180, H = 120, L = 30, B = 20, T = 8; const mx = Math.max(1, ...A.map(a => a.commits));
  const bw = (W - L) / A.length;
  const bars = A.map((a, i) => {
    const h = (a.commits / mx) * (H - T - B), x = L + i * bw;
    const lab = A.length <= 14 || i % Math.ceil(A.length / 12) === 0;
    return `<rect x="${(x + bw * .14).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw * .72).toFixed(1)}" height="${Math.max(h, a.commits ? 1.5 : 0).toFixed(1)}" rx="2.5" fill="${heatCss(.25 + .6 * a.commits / mx)}"><title>${a.month}: ${a.commits} commits, ${a.authors} authors</title></rect>` +
      (lab ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${a.month.slice(2)}</text>` : "");
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g class="axis"><line class="grid-line" x1="${L}" x2="${W}" y1="${T}" y2="${T}"/><text x="${L - 6}" y="${T + 4}" text-anchor="end">${mx}</text><text x="${L - 6}" y="${H - B + 3}" text-anchor="end">0</text>${bars}</g></svg>`;
}

/* coupling */
function couplingHtml() {
  const P = D.coupling.pairs.filter(p => st.cpl === "all" || p.surprising).slice(0, 14);
  if (!P.length) return `<div class="empty">No file pairs reach the thresholds (≥${M.min_shared} shared commits, ≥${pct(M.min_degree)} coupling).</div>`;
  const kindL = { "cross-module": "cross-module", "test-source": "test ↔ source", "docs-source": "docs ↔ source", "config-source": "config", "same-module": "same module", "test-test": "tests", "docs-docs": "docs" };
  return P.map(p => `<div class="pair"><div><code>${esc(p.a)}</code><span class="arrow">↔</span><code>${esc(p.b)}</code></div>
    <div class="deg"><b>${pct(p.degree)}</b><div><i style="width:${p.degree * 100}%"></i></div></div>
    <div class="meta">${p.shared} shared commits · changed ${p.revs_a} / ${p.revs_b} times<span class="badge ${p.surprising ? "x" : "k"}">${kindL[p.kind] || p.kind}</span></div></div>`).join("");
}
function matrixHtml() {
  const P = D.coupling.pairs.slice(0, 60);
  if (P.length < 1) return `<div class="empty">Nothing to plot.</div>`;
  const score = new Map(); P.forEach(p => { score.set(p.a, (score.get(p.a) || 0) + p.strength); score.set(p.b, (score.get(p.b) || 0) + p.strength); });
  const names = Array.from(score.keys()).sort((a, b) => score.get(b) - score.get(a)).slice(0, 18).sort();
  const n = names.length, ix = new Map(names.map((p, i) => [p, i]));
  const cell = new Map(); P.forEach(p => { if (ix.has(p.a) && ix.has(p.b)) { cell.set(ix.get(p.a) + "," + ix.get(p.b), p); cell.set(ix.get(p.b) + "," + ix.get(p.a), p); } });
  const W = 560, Lm = 168, Tm = 96, cs = Math.min(26, (W - Lm - 8) / n), H = Tm + n * cs + 6;
  const short = (p, k) => { const b = p.split("/").pop(); const d = p.includes("/") ? p.split("/").slice(-2, -1)[0] + "/" : ""; const s = d + b; return s.length > k ? "…" + s.slice(-(k - 1)) : s; };
  let s = "";
  for (let c = 0; c < n; c++) s += `<text transform="translate(${(Lm + c * cs + cs / 2 + 3).toFixed(1)},${Tm - 6}) rotate(-58)" text-anchor="start"><title>${esc(names[c])}</title>${esc(short(names[c], 16))}</text>`;
  for (let r = 0; r < n; r++) {
    s += `<text x="${Lm - 8}" y="${(Tm + r * cs + cs / 2 + 3.5).toFixed(1)}" text-anchor="end"><title>${esc(names[r])}</title>${esc(short(names[r], 26))}</text>`;
    for (let c = 0; c < n; c++) {
      const p = cell.get(r + "," + c), x = Lm + c * cs, y = Tm + r * cs;
      if (r === c) s += `<rect class="cell" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${css("--line")}" opacity=".6"/>`;
      else if (p) s += `<rect class="cell" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${heatCss(clamp((p.degree - .25) / .75) * .9 + .1)}"><title>${esc(p.a)} ↔ ${esc(p.b)}\n${p.shared} shared commits, ${pct(p.degree)} coupling</title></rect>` + (p.surprising ? `<circle cx="${x + cs / 2}" cy="${y + cs / 2}" r="2.6" fill="${css("--card")}" opacity=".95"/>` : "");
      else s += `<rect class="cell" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${css("--bg-2")}"/>`;
    }
  }
  return `<svg id="matrix" viewBox="0 0 ${W} ${H}">${s}</svg><div class="legend" style="padding:6px 0 0"><span class="sw">weak<span class="ramp" style="width:110px"></span>strong</span><span class="sw"><i style="background:var(--ink-3);border-radius:50%;width:7px;height:7px"></i>crosses modules</span></div>`;
}

    gone.map(f => `<tr><td class="l file" style="text-align:left;color:var(--ink);width:auto"><code>${esc(f.p)}</code></td><td>${fmt(f.l)}</td><td>${f.n}</td><td class="l" style="text-align:left"><span class="dot" style="background:${authColor(f.ma)}"></span> ${esc(authName(f.ma))} <span class="muted">${pct(f.ms)}</span></td><td class="status-gone">${f.ml ? f.ml.slice(0, 10) : "-"}</td><td>${f.s.toFixed(2)}</td></tr>`).join("") + `</tbody></table></div>` : `<div class="empty">Every changed file has a main author who is still active.</div>`;
  return { dirT, authT, goneT };
}

  $("#findings-list").addEventListener("click", e => { const f = e.target.closest("[data-focus]"); if (f) focusFile(f.dataset.focus); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { drawMap(); }, 120); });
  drawMap(); drawLegend(); drawTable();

}
