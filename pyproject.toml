[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codeheat"
dynamic = ["version"]
description = "Behavioural code analysis for git repositories: hotspots, change coupling, knowledge risk and complexity trends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["git", "code-quality", "hotspots", "technical-debt", "code-analysis", "bus-factor", "complexity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["lizard>=1.17", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7", "playwright"]

[project.scripts]
codeheat = "codeheat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "codeheat.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codeheat.report" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
